<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocioso - Cosas que no conocías</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Página de inicio -->
        <div id="home-page" class="page active">
            <div class="container">
                <h1 class="logo">¡Ocioso! ¿Hoy no quieres estudiar?</h1>
                <p class="subtitle">Muy mal, pues deberías estar estudiando, pero al menos aprende algo curioso o que te será de utilidad en tu vida. Recuerda que si el profesor te ve viendo contenidos de aquí puede que no te permita leerlos o sí, tú prueba.</p>
                <button id="discover-btn" class="discover-button">
                    💡 Cosas que no conocías
                </button>
            </div>
        </div>

        <!-- Página de listado de artículos -->
        <div id="articles-page" class="page">
            <div class="container">
                <h1 class="logo small">Ocioso</h1>
                <h2 class="articles-title">Descubre cosas que no sabías</h2>
                <div id="articles-list" class="articles-list"></div>
                <button id="back-home" class="back-button">← Volver al inicio</button>
            </div>
        </div>

        <!-- Página de artículo individual -->
        <div id="article-page" class="page">
            <div class="article-container">
                <button id="back-articles" class="back-button">← Volver a la lista</button>
                <div id="article-content"></div>
            </div>
        </div>
    </div>

    <script src="articles.js"></script>
    <script src="app.js"></script>
</body>
</html>
